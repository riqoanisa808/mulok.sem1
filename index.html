<script>
const MODS=[{"key":"11","kode":"1.1","title":"Adat Istiadat sebagai Kekuatan Hidup","intro":"Adat istiadat bagi masyarakat Dayak bukan sekadar kebiasaan turun-temurun, melainkan pedoman hidup yang menjadi kekuatan spiritual, sosial, dan moral bagi setiap warganya.","subs":[{"kode":"1.1.1","title":"Pengertian Adat Istiadat sebagai Kekuatan Hidup","content":"\n        <p>Adat istiadat adalah kumpulan nilai, norma, kebiasaan, dan aturan tidak tertulis yang diwariskan secara turun-temurun dan dijadikan pedoman berpikir, bersikap, serta bertindak oleh suatu masyarakat. Bagi masyarakat Dayak, adat istiadat dipandang sebagai <strong>kekuatan hidup</strong> karena menjadi sumber pegangan dalam menjalani kehidupan sehari-hari, mulai dari kelahiran, pernikahan, bercocok tanam, hingga kematian.</p>\n        <p>Falsafah hidup yang dikenal dengan istilah <em>Belom Bahadat</em> &mdash; hidup dengan tata krama dan adab &mdash; menjadi inti dari kekuatan adat ini. Adat bukan sekadar aturan, tetapi juga jalan untuk menjaga keseimbangan antara manusia, sesama, alam, dan Sang Pencipta.</p>\n        <div class=\"callout\"><strong>Contoh nyata:</strong> Rumah Betang (rumah panjang) yang dihuni banyak keluarga menjadi simbol kebersamaan, gotong royong, dan kerukunan &mdash; nilai adat yang menjaga kekuatan hidup bermasyarakat.</div>\n      "},{"kode":"1.1.2","title":"Pentingnya Adat Istiadat dalam Menangkal Pengaruh Negatif","content":"\n        <p>Di tengah arus modernisasi dan globalisasi, generasi muda menghadapi berbagai pengaruh negatif seperti sikap individualis, gaya hidup konsumtif, dan lunturnya rasa hormat kepada orang tua serta lingkungan. Adat istiadat berfungsi sebagai benteng identitas budaya yang menyaring nilai-nilai luar agar tidak menggerus jati diri masyarakat.</p>\n        <ul>\n          <li>Menumbuhkan rasa memiliki dan bangga terhadap budaya sendiri.</li>\n          <li>Menjadi rambu moral dalam bergaul dan bermasyarakat.</li>\n          <li>Memperkuat solidaritas sosial melalui kegiatan adat bersama.</li>\n          <li>Menjaga kelestarian alam melalui kearifan lokal (mis. aturan adat berladang dan berburu).</li>\n        </ul>\n        <p>Dengan memahami dan menghayati adat istiadat, peserta didik diharapkan mampu menyaring pengaruh negatif sekaligus tetap terbuka terhadap kemajuan zaman secara bijak.</p>\n      "}],"lkpd":{"tujuan":["Peserta didik mampu menjelaskan pengertian adat istiadat sebagai kekuatan hidup.","Peserta didik mampu mengidentifikasi peran adat istiadat dalam menangkal pengaruh negatif kehidupan."],"petunjuk":"Kerjakan setiap bagian di bawah ini secara mandiri atau berkelompok. Gunakan buku sumber dan pengamatan di lingkungan sekitar sebagai referensi.","sections":[{"sub":"1.1.1 Pengertian Adat Istiadat sebagai Kekuatan Hidup","tasks":["Jelaskan dengan kalimatmu sendiri, apa yang dimaksud dengan 'adat istiadat sebagai kekuatan hidup'.","Sebutkan satu contoh falsafah/nilai adat Dayak (misalnya Belom Bahadat atau Huma Betang) dan jelaskan maknanya."]},{"sub":"1.1.2 Pentingnya Adat dalam Menangkal Pengaruh Negatif","tasks":["Sebutkan tiga pengaruh negatif zaman modern yang dapat ditangkal melalui penerapan adat istiadat.","Berikan satu contoh nyata di lingkunganmu bagaimana adat istiadat membantu menjaga nilai moral generasi muda."]}]},"quiz":[{"q":"Mengapa adat istiadat disebut sebagai 'kekuatan hidup' bagi masyarakat Dayak?","o":["Karena hanya berlaku pada acara pernikahan","Karena menjadi pedoman berpikir, bersikap, dan bertindak dalam seluruh aspek kehidupan","Karena diciptakan oleh pemerintah daerah","Karena hanya berupa aturan tertulis di kantor adat"],"a":1,"e":"Adat istiadat menjadi pedoman hidup yang menopang seluruh aspek kehidupan masyarakat, bukan hanya pada momen tertentu."},{"q":"Istilah yang menggambarkan falsafah 'hidup dengan tata krama dan adab' pada masyarakat Dayak adalah...","o":["Huma Betang","Belom Bahadat","Tiwah","Mantir Adat"],"a":1,"e":"Belom Bahadat berarti hidup dengan adab/tata krama, menjadi inti falsafah adat Dayak."},{"q":"Rumah Betang menjadi simbol nilai adat berupa...","o":["Persaingan antarwarga","Kebersamaan, gotong royong, dan kerukunan","Kepemilikan pribadi atas tanah","Pemisahan antar suku"],"a":1,"e":"Rumah Betang dihuni banyak keluarga sebagai simbol kebersamaan dan kerukunan hidup bermasyarakat."},{"q":"Salah satu peran adat istiadat dalam menangkal pengaruh negatif zaman modern adalah...","o":["Melarang segala bentuk teknologi baru","Menjadi rambu moral dan penyaring nilai-nilai yang tidak sesuai","Menghapus interaksi dengan budaya luar","Menggantikan hukum negara sepenuhnya"],"a":1,"e":"Adat berfungsi sebagai penyaring nilai, bukan menolak seluruh kemajuan."},{"q":"Kearifan lokal adat, misalnya aturan adat berladang dan berburu, pada dasarnya bertujuan untuk...","o":["Membatasi hasil panen warga","Menjaga kelestarian alam dan keseimbangan lingkungan","Menambah pajak hasil hutan","Menghentikan seluruh kegiatan pertanian"],"a":1,"e":"Aturan adat tentang alam umumnya bertujuan menjaga kelestarian dan keseimbangan lingkungan."},{"q":"Adat istiadat adalah kumpulan nilai, norma, dan aturan yang bersifat...","o":["Tidak tertulis dan diwariskan turun-temurun","Dibuat oleh satu orang","Hanya berlaku sementara","Tertulis dan dibuat pemerintah"],"a":0},{"q":"Falsafah Belom Bahadat bermakna...","o":["Hidup tanpa aturan","Hidup mengejar harta","Hidup menyendiri","Hidup dengan tata krama dan adab"],"a":3},{"q":"Rumah Betang dihuni oleh...","o":["Satu keluarga kecil","Wisatawan","Hanya para tetua adat","Banyak keluarga dalam satu rumah panjang"],"a":3},{"q":"Adat dipandang sebagai jalan menjaga keseimbangan antara manusia, sesama, alam, dan...","o":["Teknologi","Sang Pencipta","Pasar","Pemerintah"],"a":1},{"q":"Salah satu pengaruh negatif modernisasi bagi generasi muda adalah...","o":["Sikap individualis","Hormat kepada orang tua","Gotong royong","Cinta budaya"],"a":0},{"q":"Adat istiadat berfungsi sebagai benteng...","o":["Identitas budaya","Politik","Wilayah","Ekonomi"],"a":0},{"q":"Sikap yang tumbuh dari menghayati adat istiadat adalah...","o":["Rasa memiliki dan bangga pada budaya sendiri","Mudah terpengaruh","Malu pada budaya sendiri","Acuh tak acuh"],"a":0},{"q":"Kegiatan adat bersama dapat memperkuat...","o":["Perpecahan","Solidaritas sosial","Persaingan","Individualisme"],"a":1},{"q":"Adat menjadi pegangan hidup dalam peristiwa berikut, kecuali...","o":["Kelahiran","Pernikahan","Bercocok tanam","Hanya hiburan semata"],"a":3},{"q":"Sikap bijak generasi muda terhadap kemajuan zaman menurut materi adalah...","o":["Menolak semuanya","Menerima semuanya","Menghindari pergaulan","Menyaring pengaruh negatif sambil tetap terbuka"],"a":3},{"q":"Gaya hidup konsumtif dapat ditangkal dengan nilai adat berupa...","o":["Kesederhanaan","Persaingan","Kemewahan","Pemborosan"],"a":0},{"q":"Gotong royong dalam kehidupan Rumah Betang mencerminkan...","o":["Larangan bergaul","Kepemilikan pribadi","Kekuatan hidup bermasyarakat","Pemisahan tugas pribadi"],"a":2},{"q":"Aturan adat berburu dan berladang termasuk contoh...","o":["Aturan sekolah","Kebijakan pajak","Kearifan lokal","Hukum negara tertulis"],"a":2},{"q":"Melunturnya rasa hormat kepada orang tua termasuk dampak dari...","o":["Kuatnya adat","Pengaruh negatif yang tidak disaring","Musyawarah","Gotong royong"],"a":1},{"q":"Kesimpulan tepat tentang adat istiadat bagi masyarakat Dayak adalah...","o":["Hiburan musiman","Pedoman hidup yang menjadi kekuatan spiritual, sosial, dan moral","Aturan tertulis negara","Sekadar kebiasaan lama"],"a":1}]},{"key":"12","kode":"1.2","title":"Sikap dan Perilaku sebagai Jati Diri","intro":"Sikap dan perilaku seseorang mencerminkan jati diri dan kepribadiannya. Dalam adat Dayak, sikap dan perilaku diatur agar selaras dengan waktu, tempat, dan status sosial seseorang.","subs":[{"kode":"1.2.1","title":"Pengertian dan Makna Sikap dan Perilaku sebagai Jati Diri","content":"\n        <p>Sikap adalah kecenderungan batin seseorang dalam merespons sesuatu, sedangkan perilaku adalah wujud nyata dari sikap tersebut dalam tindakan sehari-hari. Dalam pandangan adat, sikap dan perilaku seseorang mencerminkan siapa dirinya &mdash; disebut sebagai <strong>jati diri</strong>.</p>\n        <p>Seseorang yang menjunjung adat akan menampilkan sikap rendah hati, hormat kepada orang yang lebih tua, santun kepada tamu, dan bertanggung jawab terhadap kewajiban sosialnya. Sikap tersebut bukan basa-basi semata, melainkan cerminan penghayatan nilai adat yang tertanam sejak kecil.</p>\n      "},{"kode":"1.2.2","title":"Sikap dan Perilaku terhadap Sesama Sesuai Waktu, Tempat, dan Status","content":"\n        <p>Adat Dayak mengajarkan bahwa sikap dan perilaku harus disesuaikan dengan konteks &mdash; dikenal dengan prinsip kesesuaian <strong>waktu, tempat, dan status</strong> (mirip dengan unggah-ungguh dalam budaya lain).</p>\n        <ul>\n          <li><strong>Waktu:</strong> sikap saat upacara adat berbeda dengan sikap dalam pergaulan sehari-hari.</li>\n          <li><strong>Tempat:</strong> sikap di rumah Betang, di balai adat, atau di hutan adat memiliki tata krama tersendiri.</li>\n          <li><strong>Status:</strong> cara bersikap kepada Damang/Mantir Adat, orang tua, sebaya, maupun tamu berbeda-beda, namun tetap dilandasi rasa hormat.</li>\n        </ul>\n        <div class=\"callout\"><strong>Contoh:</strong> Saat menghadiri musyawarah adat, seseorang duduk dan berbicara sesuai gilirannya, menunjukkan penghormatan terhadap tetua dan proses adat yang berlangsung.</div>\n      "}],"lkpd":{"tujuan":["Peserta didik mampu menjelaskan makna sikap dan perilaku sebagai jati diri.","Peserta didik mampu memberi contoh penyesuaian sikap terhadap sesama sesuai waktu, tempat, dan status."],"petunjuk":"Amati interaksi di lingkungan sekitarmu (keluarga, sekolah, atau acara adat) untuk menjawab pertanyaan berikut.","sections":[{"sub":"1.2.1 Sikap dan Perilaku sebagai Jati Diri","tasks":["Jelaskan mengapa sikap dan perilaku dapat mencerminkan jati diri seseorang.","Tuliskan tiga sikap yang menurutmu penting dimiliki agar dihormati dalam kehidupan bermasyarakat."]},{"sub":"1.2.2 Penyesuaian Sikap terhadap Waktu, Tempat, dan Status","tasks":["Berikan satu contoh perbedaan sikap yang kamu tunjukkan pada waktu/tempat yang berbeda.","Bagaimana caramu bersikap kepada orang yang status/kedudukannya lebih tinggi (misalnya guru, tetua adat)? Jelaskan."]}]},"quiz":[{"q":"Sikap dan perilaku seseorang menurut pandangan adat mencerminkan...","o":["Kekayaan seseorang","Jati diri dan kepribadian seseorang","Tingkat pendidikan formal semata","Jumlah harta warisan keluarga"],"a":1,"e":"Sikap dan perilaku dipandang sebagai cerminan jati diri seseorang dalam adat."},{"q":"Prinsip penyesuaian sikap dalam adat Dayak terhadap sesama meliputi tiga hal, yaitu...","o":["Uang, harta, dan jabatan","Waktu, tempat, dan status","Usia, ras, dan agama semata","Pendidikan, pekerjaan, dan gaji"],"a":1,"e":"Adat menekankan kesesuaian sikap dengan waktu, tempat, dan status sosial."},{"q":"Ketika menghadiri musyawarah adat, sikap yang mencerminkan penghormatan adalah...","o":["Berbicara kapan saja tanpa menunggu giliran","Duduk dan berbicara sesuai gilirannya","Meninggalkan tempat sebelum acara selesai","Mengabaikan pendapat tetua adat"],"a":1,"e":"Menghormati giliran bicara adalah wujud sikap sopan dalam forum adat."},{"q":"Mengapa sikap hormat kepada orang yang lebih tua penting dalam adat?","o":["Karena diwajibkan oleh hukum negara","Karena mencerminkan penghayatan nilai adat sejak kecil","Karena orang tua selalu benar","Karena hanya berlaku pada acara resmi"],"a":1,"e":"Sikap hormat merupakan wujud penghayatan nilai adat yang tertanam sejak dini, bukan sekadar formalitas."},{"q":"Sikap di rumah Betang, di balai adat, dan di hutan adat dapat berbeda karena mempertimbangkan aspek...","o":["Tempat","Warna pakaian","Cuaca","Harga barang"],"a":0,"e":"Perbedaan tempat menuntut penyesuaian tata krama sesuai konteksnya."},{"q":"Sikap adalah...","o":["Jabatan seseorang","Kecenderungan batin dalam merespons sesuatu","Tindakan nyata saja","Harta seseorang"],"a":1},{"q":"Perilaku adalah...","o":["Wujud nyata sikap dalam tindakan sehari-hari","Cita-cita","Perasaan di dalam hati","Keturunan"],"a":0},{"q":"Jati diri seseorang tampak melalui...","o":["Sikap dan perilakunya","Rumahnya","Hartanya","Warna kulitnya"],"a":0},{"q":"Orang yang menjunjung adat menampilkan sikap...","o":["Rendah hati dan hormat","Egois","Sombong","Acuh tak acuh"],"a":0},{"q":"Sikap santun kepada tamu merupakan wujud...","o":["Keterpaksaan","Basa-basi belaka","Persaingan","Penghayatan nilai adat"],"a":3},{"q":"Tiga aspek kesesuaian sikap dalam adat Dayak adalah...","o":["Waktu, tempat, status","Suku, agama, ras","Pakaian, rumah, kendaraan","Umur, harta, jabatan"],"a":0},{"q":"Sikap saat upacara adat sebaiknya...","o":["Lebih khidmat dan tertib","Tidak perlu hadir","Bebas tanpa aturan","Sama dengan saat bermain"],"a":0},{"q":"Siapa yang dihormati dengan sikap khusus dalam forum adat?","o":["Damang/Mantir Adat dan tetua","Orang paling kaya","Siapa pun yang berisik","Orang paling muda"],"a":0},{"q":"Sikap terhadap teman sebaya...","o":["Boleh lebih santai namun tetap sopan","Tidak perlu dihargai","Harus sama dengan kepada tetua adat","Boleh kasar"],"a":0},{"q":"Mengapa sikap hormat disebut bukan sekadar basa-basi?","o":["Karena tertanam sejak kecil sebagai nilai adat","Karena menguntungkan secara ekonomi","Karena diwajibkan sanksi pidana","Karena hanya untuk tamu"],"a":0},{"q":"Contoh sikap tepat di balai adat adalah...","o":["Berlarian","Berteriak","Memotong pembicaraan","Duduk tertib dan mendengarkan"],"a":3},{"q":"Dampak tidak menyesuaikan sikap dengan konteks adalah...","o":["Dianggap tidak sopan dan merusak keharmonisan","Mendapat hadiah","Tidak berdampak apa pun","Dipuji semua orang"],"a":0},{"q":"Tanggung jawab terhadap kewajiban sosial termasuk ciri...","o":["Orang yang individualis","Orang yang tak peduli","Orang yang menjunjung adat","Orang yang melanggar adat"],"a":2},{"q":"Unggah-ungguh pada budaya lain mirip dengan prinsip...","o":["Perburuan","Pertanian","Jual beli","Kesesuaian waktu, tempat, dan status"],"a":3},{"q":"Tujuan penyesuaian sikap dalam pergaulan adalah...","o":["Mencari keuntungan","Menghindari pertemuan","Menunjukkan kekuasaan","Menjaga keharmonisan dan rasa hormat"],"a":3}]},{"key":"13","kode":"1.3","title":"Tutur Kata sebagai Jati Diri","intro":"Bahasa dan tutur kata mencerminkan kepribadian serta penghormatan seseorang terhadap orang lain. Dalam adat Dayak, cara bertutur kata diatur agar selaras dengan waktu, tempat, dan status lawan bicara.","subs":[{"kode":"1.3.1","title":"Pengertian dan Makna Tutur Kata Sesuai Waktu, Tempat, dan Status","content":"\n        <p>Tutur kata adalah cara seseorang berbicara, memilih kata, dan menyampaikan maksud kepada orang lain. Dalam budaya Dayak, tutur kata dipandang sebagai cerminan jati diri karena melalui cara berbicara, dapat terlihat kesopanan, kejujuran, dan penghormatan seseorang.</p>\n        <p>Sama seperti sikap dan perilaku, tutur kata juga perlu disesuaikan dengan waktu, tempat, dan status lawan bicara. Bahasa yang digunakan saat berbincang santai berbeda dengan bahasa yang digunakan dalam upacara adat resmi atau saat berbicara dengan tetua adat.</p>\n      "},{"kode":"1.3.2","title":"Tutur Kata terhadap Sesama Sesuai Waktu, Tempat, dan Status","content":"\n        <p>Dalam praktiknya, masyarakat Dayak mengenal tingkatan cara berbicara: bahasa sehari-hari yang santai digunakan antarteman sebaya, sementara bahasa yang lebih halus dan penuh penghormatan digunakan kepada orang tua, tetua adat, atau dalam forum resmi seperti musyawarah adat.</p>\n        <ul>\n          <li>Berbicara dengan nada rendah dan sopan kepada yang lebih tua.</li>\n          <li>Menghindari kata-kata kasar atau menyinggung dalam pergaulan.</li>\n          <li>Menggunakan ungkapan atau pantun adat pada acara-acara tertentu sebagai bentuk penghormatan.</li>\n        </ul>\n        <div class=\"callout\"><strong>Nilai penting:</strong> Tutur kata yang baik menjaga keharmonisan hubungan sosial dan mencegah terjadinya konflik akibat kesalahpahaman.</div>\n      "}],"lkpd":{"tujuan":["Peserta didik mampu menjelaskan makna tutur kata sebagai jati diri.","Peserta didik mampu memberi contoh tutur kata yang sesuai dengan waktu, tempat, dan status."],"petunjuk":"Diskusikan dengan teman atau keluargamu mengenai kebiasaan bertutur kata di lingkunganmu, kemudian jawab pertanyaan berikut.","sections":[{"sub":"1.3.1 Makna Tutur Kata Sesuai Waktu, Tempat, dan Status","tasks":["Jelaskan mengapa tutur kata dianggap sebagai cerminan jati diri seseorang.","Berikan satu contoh situasi di mana kamu perlu mengubah cara bicaramu karena lawan bicara yang berbeda."]},{"sub":"1.3.2 Tutur Kata terhadap Sesama","tasks":["Tuliskan satu contoh ungkapan sopan yang biasa digunakan di daerahmu kepada orang yang lebih tua.","Jelaskan akibat yang mungkin terjadi apabila seseorang bertutur kata kasar dalam pergaulan sehari-hari."]}]},"quiz":[{"q":"Tutur kata dipandang sebagai cerminan jati diri karena...","o":["Menunjukkan kekayaan seseorang","Menunjukkan kesopanan, kejujuran, dan penghormatan seseorang","Menentukan status sosial secara otomatis","Hanya digunakan pada acara resmi"],"a":1,"e":"Cara berbicara mencerminkan karakter, kesopanan, dan penghormatan seseorang."},{"q":"Bahasa yang lebih halus dan penuh penghormatan biasanya digunakan ketika berbicara dengan...","o":["Teman sebaya saat bermain","Tetua adat atau dalam forum resmi","Hewan peliharaan","Diri sendiri"],"a":1,"e":"Bahasa halus dan penuh hormat digunakan kepada tetua adat atau dalam forum resmi."},{"q":"Salah satu manfaat menjaga tutur kata yang baik dalam pergaulan adalah...","o":["Menimbulkan kesalahpahaman","Menjaga keharmonisan hubungan sosial","Membuat orang lain takut","Menunjukkan kekuasaan"],"a":1,"e":"Tutur kata yang baik mencegah konflik dan menjaga keharmonisan sosial."},{"q":"Penggunaan pantun atau ungkapan adat pada acara tertentu bertujuan untuk...","o":["Mempersulit komunikasi","Menunjukkan bentuk penghormatan","Menghindari tanggung jawab","Menyingkat waktu acara"],"a":1,"e":"Pantun/ungkapan adat digunakan sebagai wujud penghormatan dalam acara tertentu."},{"q":"Menghindari kata-kata kasar dalam pergaulan sehari-hari termasuk contoh...","o":["Tutur kata yang menjaga keharmonisan sosial","Pelanggaran hukum adat","Sikap acuh tak acuh","Bentuk upacara adat"],"a":0,"e":"Menghindari kata kasar adalah wujud tutur kata yang baik dan menjaga hubungan sosial."},{"q":"Tutur kata adalah...","o":["Cara berjalan","Cara menulis saja","Cara berbicara, memilih kata, dan menyampaikan maksud","Cara berpakaian"],"a":2},{"q":"Melalui tutur kata terlihat...","o":["Tinggi badan","Jumlah harta","Kesopanan, kejujuran, dan penghormatan","Asal daerah saja"],"a":2},{"q":"Bahasa saat berbincang santai berbeda dengan bahasa di...","o":["Upacara adat resmi","Pasar","Lapangan olahraga","Kantin"],"a":0},{"q":"Bahasa sehari-hari yang santai biasa dipakai kepada...","o":["Teman sebaya","Tetua adat","Damang saat musyawarah","Tamu kehormatan"],"a":0},{"q":"Kepada tetua adat sebaiknya digunakan bahasa yang...","o":["Kasar","Bercanda","Berteriak","Halus dan penuh penghormatan"],"a":3},{"q":"Nada bicara kepada yang lebih tua sebaiknya...","o":["Mengejek","Cepat tanpa jeda","Rendah dan sopan","Tinggi"],"a":2},{"q":"Hal yang dihindari dalam pergaulan adalah...","o":["Kata-kata kasar dan menyinggung","Pantun adat","Ungkapan sopan","Salam"],"a":0},{"q":"Pantun adat digunakan pada acara tertentu sebagai bentuk...","o":["Ejekan","Iklan","Persaingan","Penghormatan"],"a":3},{"q":"Tutur kata yang baik mencegah konflik akibat...","o":["Doa","Kesalahpahaman","Gotong royong","Kerja sama"],"a":1},{"q":"Forum resmi yang memerlukan tutur kata halus adalah...","o":["Obrolan di warung","Panggilan teman","Musyawarah adat","Permainan bola"],"a":2},{"q":"Tutur kata sama seperti sikap karena perlu disesuaikan dengan...","o":["Harga barang","Waktu, tempat, dan status lawan bicara","Warna pakaian","Cuaca"],"a":1},{"q":"Kejujuran dalam bertutur termasuk cerminan...","o":["Keturunan","Kekayaan","Jati diri","Kekuasaan"],"a":2},{"q":"Contoh tutur kata yang tepat kepada orang tua adalah...","o":["\"Hei, jawab cepat!\"","\"Mohon izin, Bapak, saya ingin bertanya.\"","\"Jangan ikut campur.\"","\"Terserah kamu.\""],"a":1},{"q":"Nilai penting tutur kata yang baik adalah menjaga...","o":["Jarak antarwarga","Persaingan antarwarga","Kekuasaan","Keharmonisan hubungan sosial"],"a":3},{"q":"Berbicara santai di tengah upacara adat resmi dianggap...","o":["Wujud penghormatan","Sangat tepat","Wajib dilakukan","Kurang sesuai dengan waktu dan tempat"],"a":3}]},{"key":"14","kode":"1.4","title":"Acara Adat sebagai Bentuk Komunikasi dengan Tuhan, Alam, dan Leluhur","intro":"Berbagai upacara adat dilaksanakan sebagai sarana komunikasi spiritual masyarakat Dayak dengan Sang Pencipta, alam semesta, dan para leluhur.","subs":[{"kode":"1.4.1","title":"Pengertian dan Makna Acara Adat sebagai Komunikasi dengan Tuhan, Alam, dan Leluhur","content":"\n        <p>Acara adat adalah rangkaian ritual atau upacara yang dilaksanakan masyarakat berdasarkan aturan dan kepercayaan turun-temurun. Bagi masyarakat Dayak, khususnya penganut kepercayaan Kaharingan, acara adat dipandang sebagai jembatan komunikasi antara manusia dengan Ranying Hatalla Langit (Sang Pencipta), alam semesta, dan roh para leluhur.</p>\n        <p>Melalui acara adat, masyarakat menyampaikan rasa syukur, permohonan, maupun penghormatan kepada kekuatan yang diyakini menjaga keseimbangan hidup, baik di dunia nyata maupun dunia spiritual.</p>\n      "},{"kode":"1.4.2","title":"Jenis dan Makna Acara Adat sebagai Doa dan Harapan","content":"\n        <p>Terdapat berbagai jenis acara adat dengan makna doa dan harapan yang berbeda-beda, di antaranya:</p>\n        <ul>\n          <li><strong>Tiwah</strong> &mdash; upacara pengantaran arwah leluhur ke alam baka sebagai bentuk penghormatan terakhir dan doa keselamatan bagi yang telah meninggal.</li>\n          <li><strong>Manasai/Nahunan</strong> &mdash; upacara terkait daur hidup manusia (kelahiran, pemberian nama) sebagai doa keselamatan dan harapan baik bagi anak.</li>\n          <li><strong>Upacara syukuran panen</strong> &mdash; ungkapan terima kasih kepada alam dan Sang Pencipta atas hasil bumi.</li>\n          <li><strong>Ritual penyembuhan/tolak bala</strong> &mdash; permohonan keselamatan dan kesehatan bagi warga masyarakat.</li>\n        </ul>\n        <div class=\"callout\"><strong>Makna penting:</strong> Setiap acara adat mengandung doa dan harapan agar kehidupan manusia senantiasa selaras dan seimbang dengan alam serta yang gaib.</div>\n      "}],"lkpd":{"tujuan":["Peserta didik mampu menjelaskan makna acara adat sebagai bentuk komunikasi dengan Tuhan, alam, dan leluhur.","Peserta didik mampu menyebutkan jenis-jenis acara adat beserta makna doa dan harapannya."],"petunjuk":"Gunakan hasil wawancara dengan orang tua/tokoh adat atau referensi bacaan untuk menjawab pertanyaan berikut.","sections":[{"sub":"1.4.1 Makna Acara Adat sebagai Komunikasi Spiritual","tasks":["Jelaskan mengapa acara adat dianggap sebagai bentuk komunikasi dengan Tuhan, alam, dan leluhur.","Menurutmu, apa yang membedakan acara adat dengan kegiatan perayaan biasa?"]},{"sub":"1.4.2 Jenis dan Makna Acara Adat","tasks":["Sebutkan dua jenis acara adat yang kamu ketahui beserta makna doa/harapannya masing-masing.","Ceritakan singkat pengalaman atau pengetahuanmu tentang salah satu acara adat yang pernah kamu lihat atau ikuti."]}]},"quiz":[{"q":"Acara adat bagi masyarakat Dayak dipandang sebagai...","o":["Hiburan semata","Jembatan komunikasi dengan Tuhan, alam, dan leluhur","Kegiatan tanpa makna khusus","Kewajiban administratif desa"],"a":1,"e":"Acara adat berfungsi sebagai sarana komunikasi spiritual dengan Sang Pencipta, alam, dan leluhur."},{"q":"Upacara pengantaran arwah leluhur ke alam baka dikenal dengan istilah...","o":["Tiwah","Nahunan","Mantir","Damang"],"a":0,"e":"Tiwah adalah upacara pengantaran arwah leluhur dalam kepercayaan Kaharingan."},{"q":"Upacara syukuran panen dilaksanakan sebagai bentuk...","o":["Protes terhadap alam","Ungkapan terima kasih atas hasil bumi","Perayaan tanpa tujuan khusus","Penolakan terhadap hasil panen"],"a":1,"e":"Upacara syukuran panen adalah ungkapan terima kasih kepada Sang Pencipta dan alam."},{"q":"Kepercayaan tradisional masyarakat Dayak yang erat kaitannya dengan berbagai acara adat disebut...","o":["Kaharingan","Konfusianisme","Animisme Yunani","Shintoisme"],"a":0,"e":"Kaharingan adalah kepercayaan tradisional Dayak yang mendasari berbagai upacara adat."},{"q":"Setiap acara adat pada dasarnya mengandung...","o":["Doa dan harapan agar hidup selaras dengan alam dan yang gaib","Aturan pajak daerah","Persaingan antarkampung","Larangan berinteraksi dengan tetangga"],"a":0,"e":"Acara adat mengandung doa dan harapan akan keselarasan hidup manusia, alam, dan kekuatan spiritual."},{"q":"Acara adat adalah...","o":["Rapat dinas","Rangkaian ritual berdasarkan aturan dan kepercayaan turun-temurun","Pesta modern","Kegiatan olahraga"],"a":1},{"q":"Acara adat dipandang sebagai jembatan komunikasi dengan...","o":["Pemerintah saja","Pedagang","Wisatawan","Tuhan, alam, dan leluhur"],"a":3},{"q":"Ranying Hatalla Langit dalam Kaharingan berarti...","o":["Tetua adat","Sang Pencipta","Raja","Roh hutan"],"a":1},{"q":"Penganut kepercayaan Kaharingan memandang acara adat sebagai...","o":["Sarana komunikasi spiritual","Hiburan semata","Beban","Ajang lomba"],"a":0},{"q":"Tiwah dilakukan sebagai penghormatan terakhir dan...","o":["Pesta panen","Doa keselamatan bagi yang meninggal","Pemberian nama bayi","Pernikahan"],"a":1},{"q":"Upacara daur hidup seperti pemberian nama bayi adalah...","o":["Syukuran panen","Tiwah","Tampung tawar","Manasai/Nahunan"],"a":3},{"q":"Upacara syukuran panen ditujukan kepada...","o":["Wisatawan","Pemerintah","Alam dan Sang Pencipta","Pedagang"],"a":2},{"q":"Ritual penyembuhan/tolak bala bermakna permohonan...","o":["Kemenangan","Keselamatan dan kesehatan warga","Kekayaan","Jabatan"],"a":1},{"q":"Melalui acara adat masyarakat menyampaikan syukur, permohonan, dan...","o":["Ejekan","Penghormatan","Tuntutan hukum","Persaingan"],"a":1},{"q":"Makna penting setiap acara adat adalah doa dan harapan agar hidup...","o":["Terpisah dari alam","Selaras dan seimbang dengan alam serta yang gaib","Bebas dari aturan","Penuh persaingan"],"a":1},{"q":"Tiwah mengantarkan arwah leluhur ke...","o":["Alam baka","Balai kota","Rumah Betang","Hutan adat"],"a":0},{"q":"Kehidupan yang dijaga keseimbangannya melalui adat meliputi...","o":["Dunia nyata dan dunia spiritual","Hanya dunia nyata","Hanya politik","Hanya ekonomi"],"a":0},{"q":"Nahunan terkait dengan peristiwa...","o":["Panen","Pernikahan","Kematian","Kelahiran dan pemberian nama"],"a":3},{"q":"Sikap yang harus dimiliki saat mengikuti acara adat adalah...","o":["Khidmat dan menghormati","Acuh tak acuh","Mengabaikan aturan","Bercanda berlebihan"],"a":0},{"q":"Jika acara adat dilestarikan, generasi muda akan...","o":["Menjauh dari budaya","Memahami dan menghayati nilai leluhur","Kehilangan identitas","Melupakan doa"],"a":1}]},{"key":"15","kode":"1.5","title":"Hukum Adat sebagai Sumber Hukum Positif","intro":"Hukum adat menjadi kaidah yang mengatur kehidupan bermasyarakat dan diakui keberadaannya sebagai salah satu sumber hukum yang berlaku di tengah masyarakat.","subs":[{"kode":"1.5.1","title":"Pengertian dan Makna Hukum Adat sebagai Kaidah Hukum","content":"\n        <p>Hukum adat adalah kumpulan aturan tidak tertulis yang mengatur tata kehidupan masyarakat, disepakati bersama, dan ditegakkan melalui lembaga adat seperti Damang Kepala Adat dan Mantir Adat. Hukum adat berfungsi sebagai kaidah yang mengatur hak, kewajiban, serta batasan perilaku warga masyarakat.</p>\n        <p>Berbeda dengan hukum tertulis, hukum adat bersumber dari kebiasaan dan nilai-nilai yang diwariskan turun-temurun, namun tetap memiliki kekuatan mengikat dan diakui sebagai bagian dari sistem hukum yang berlaku di suatu wilayah (hukum positif).</p>\n        <div class=\"callout\"><strong>Contoh lembaga:</strong> Damang Kepala Adat memimpin penyelesaian sengketa adat di tingkat kecamatan, dibantu oleh Mantir Adat di tingkat desa/kelurahan.</div>\n      "},{"kode":"1.5.2","title":"Jenis, Makna, dan Sanksi Pelanggaran Hukum Adat","content":"\n        <p>Pelanggaran terhadap hukum adat dapat dikelompokkan menjadi dua jenis utama:</p>\n        <ul>\n          <li><strong>Pelanggaran perdata adat</strong> &mdash; misalnya sengketa tanah adat, warisan, atau perselisihan antarwarga.</li>\n          <li><strong>Pelanggaran pidana adat</strong> &mdash; misalnya perbuatan yang mencemarkan nama baik, perzinahan menurut adat, atau perusakan simbol/benda adat.</li>\n        </ul>\n        <p>Setiap pelanggaran memiliki sanksi (sangsi) tersendiri yang ditetapkan melalui musyawarah adat, dapat berupa denda adat (jipen), penyerahan benda pusaka (gong, tempayan), permintaan maaf secara adat, atau upacara pembersihan/tampung tawar untuk memulihkan keseimbangan sosial.</p>\n      "}],"lkpd":{"tujuan":["Peserta didik mampu menjelaskan pengertian hukum adat sebagai kaidah hukum.","Peserta didik mampu mengidentifikasi jenis dan sanksi pelanggaran hukum adat."],"petunjuk":"Gunakan buku sumber Hukum Adat Kalimantan Tengah atau hasil wawancara dengan tokoh adat untuk menjawab pertanyaan berikut.","sections":[{"sub":"1.5.1 Hukum Adat sebagai Kaidah Hukum","tasks":["Jelaskan pengertian hukum adat dan sebutkan lembaga yang menegakkannya.","Mengapa hukum adat dikatakan sebagai salah satu sumber hukum positif?"]},{"sub":"1.5.2 Jenis dan Sanksi Pelanggaran Hukum Adat","tasks":["Sebutkan perbedaan antara pelanggaran perdata adat dan pidana adat, beserta contohnya.","Jelaskan satu bentuk sanksi adat yang kamu ketahui dan tujuannya bagi pelanggar maupun masyarakat."]}]},"quiz":[{"q":"Hukum adat berfungsi sebagai kaidah yang mengatur...","o":["Hanya urusan pertanian","Hak, kewajiban, dan batasan perilaku warga masyarakat","Hubungan luar negeri","Sistem perbankan"],"a":1,"e":"Hukum adat mengatur hak, kewajiban, dan batasan perilaku dalam kehidupan bermasyarakat."},{"q":"Lembaga adat yang memimpin penyelesaian sengketa adat di tingkat kecamatan disebut...","o":["Mantir Adat","Damang Kepala Adat","Kepala Desa","Camat"],"a":1,"e":"Damang Kepala Adat memimpin penyelesaian sengketa adat di tingkat kecamatan."},{"q":"Sengketa tanah adat dan warisan termasuk contoh pelanggaran...","o":["Pidana adat","Perdata adat","Hukum internasional","Aturan lalu lintas"],"a":1,"e":"Sengketa tanah dan warisan termasuk pelanggaran perdata adat."},{"q":"Denda adat yang dikenakan kepada pelanggar hukum adat dikenal dengan istilah...","o":["Jipen","Tiwah","Nahunan","Betang"],"a":0,"e":"Jipen adalah salah satu bentuk denda/sanksi adat."},{"q":"Mengapa hukum adat dianggap sebagai bagian dari hukum positif yang berlaku?","o":["Karena tertulis dalam undang-undang nasional saja","Karena diakui keberadaannya dan memiliki kekuatan mengikat dalam masyarakat","Karena tidak memiliki sanksi apa pun","Karena hanya berlaku bagi pejabat pemerintah"],"a":1,"e":"Hukum adat diakui dan memiliki kekuatan mengikat sehingga menjadi bagian dari sistem hukum yang berlaku (hukum positif)."},{"q":"Hukum adat adalah kumpulan aturan yang...","o":["Dibuat sepihak","Berlaku sebentar","Tidak tertulis dan disepakati bersama","Tertulis dan dibuat parlemen"],"a":2},{"q":"Penegak hukum adat adalah lembaga adat seperti...","o":["Damang Kepala Adat dan Mantir Adat","Sekolah","Kepolisian","Bank"],"a":0},{"q":"Hukum adat mengatur hak, kewajiban, dan...","o":["Batasan perilaku warga","Cuaca","Harga barang","Pajak negara"],"a":0},{"q":"Berbeda dengan hukum tertulis, hukum adat bersumber dari...","o":["Peraturan menteri","Undang-undang","Putusan pengadilan","Kebiasaan dan nilai turun-temurun"],"a":3},{"q":"Hukum positif adalah hukum yang...","o":["Sudah tidak berlaku","Hanya di buku","Hanya cita-cita","Berlaku di suatu wilayah pada waktu tertentu"],"a":3},{"q":"Mantir Adat bertugas di tingkat...","o":["Provinsi","Nasional","Kecamatan","Desa/kelurahan"],"a":3},{"q":"Damang Kepala Adat memimpin di tingkat...","o":["RT","Dusun","Keluarga","Kecamatan"],"a":3},{"q":"Perselisihan antarwarga termasuk pelanggaran...","o":["Perdata adat","Pidana adat","Pidana negara","Administratif"],"a":0},{"q":"Pencemaran nama baik termasuk pelanggaran...","o":["Tidak melanggar","Perdata adat","Pidana adat","Kebiasaan baik"],"a":2},{"q":"Perusakan benda adat termasuk...","o":["Pidana adat","Perdata adat","Kewajiban","Perbuatan terpuji"],"a":0},{"q":"Sanksi pelanggaran adat ditetapkan melalui...","o":["Undian","Perintah sepihak","Pemungutan suara daring","Musyawarah adat"],"a":3},{"q":"Denda adat dikenal dengan istilah...","o":["Tiwah","Betang","Pantun","Jipen"],"a":3},{"q":"Benda pusaka yang dapat diserahkan sebagai sanksi adalah...","o":["Ponsel","Gong dan tempayan","Peralatan listrik","Kendaraan"],"a":1},{"q":"Upacara untuk memulihkan keseimbangan sosial setelah pelanggaran adalah...","o":["Nahunan","Tiwah","Panen","Tampung tawar"],"a":3},{"q":"Hukum adat tetap memiliki kekuatan...","o":["Hanya hiasan","Hanya simbol","Tidak berarti","Mengikat"],"a":3}]},{"key":"16","kode":"1.6","title":"Sanksi Adat sebagai Bentuk Pengakuan yang Tidak Terpisahkan","intro":"Sanksi adat bukan sekadar hukuman, melainkan bagian yang tidak terpisahkan dari hukum adat itu sendiri &mdash; berfungsi memulihkan keseimbangan sosial dan spiritual masyarakat.","subs":[{"kode":"1.6.1","title":"Pengertian dan Makna Sanksi Adat yang Adil","content":"\n        <p>Sanksi adat adalah konsekuensi yang dikenakan kepada seseorang yang melanggar aturan atau nilai adat, ditetapkan melalui musyawarah para tetua/lembaga adat. Sanksi adat dikatakan adil apabila sesuai dengan tingkat pelanggaran, disepakati bersama, dan bertujuan memulihkan keseimbangan &mdash; bukan semata untuk menghukum atau mempermalukan.</p>\n        <p>Sanksi dan pengakuan atas kesalahan merupakan satu kesatuan yang tidak dapat dipisahkan: seseorang yang menerima sanksi sekaligus mengakui kesalahannya di hadapan masyarakat, sehingga tercipta kembali rasa saling percaya dan harmoni sosial.</p>\n      "},{"kode":"1.6.2","title":"Jenis Sanksi Adat, Konsekuensi Pelanggaran, dan Doa Pemulihan","content":"\n        <p>Beberapa jenis sanksi adat yang umum dikenal antara lain:</p>\n        <ul>\n          <li><strong>Denda materi/benda adat</strong> &mdash; berupa uang, gong, tempayan, atau hasil bumi, sesuai berat ringannya pelanggaran.</li>\n          <li><strong>Permintaan maaf secara adat</strong> &mdash; dilakukan di hadapan tetua dan masyarakat sebagai pengakuan kesalahan secara terbuka.</li>\n          <li><strong>Upacara pembersihan/tampung tawar</strong> &mdash; ritual yang disertai doa untuk memulihkan keseimbangan spiritual setelah terjadi pelanggaran.</li>\n        </ul>\n        <p>Konsekuensi bagi pelanggar tidak hanya bersifat materi, tetapi juga sosial &mdash; seperti berkurangnya kepercayaan masyarakat. Karena itu, sanksi adat selalu disertai doa dan harapan agar pelanggar dapat kembali diterima dan kehidupan bermasyarakat pulih seperti sedia kala.</p>\n        <div class=\"callout\"><strong>Nilai penting:</strong> Sanksi adat menegaskan bahwa pengakuan kesalahan dan pemulihan hubungan sosial adalah bagian yang tak terpisahkan dari penegakan hukum adat.</div>\n      "}],"lkpd":{"tujuan":["Peserta didik mampu menjelaskan pengertian dan makna sanksi adat yang adil.","Peserta didik mampu menjelaskan jenis sanksi adat serta konsekuensi dan doa pemulihannya."],"petunjuk":"Diskusikan bersama kelompok, lalu jawab pertanyaan berikut berdasarkan pemahamanmu terhadap materi dan pengamatan lingkungan.","sections":[{"sub":"1.6.1 Sanksi Adat yang Adil","tasks":["Jelaskan syarat-syarat agar suatu sanksi adat dapat dikatakan adil.","Mengapa pengakuan kesalahan dianggap tidak terpisahkan dari pemberian sanksi adat?"]},{"sub":"1.6.2 Jenis Sanksi dan Doa Pemulihan","tasks":["Sebutkan dua jenis sanksi adat beserta contohnya.","Jelaskan mengapa sanksi adat biasanya disertai dengan doa atau ritual pemulihan."]}]},"quiz":[{"q":"Sanksi adat dikatakan adil apabila...","o":["Diputuskan sepihak tanpa musyawarah","Sesuai tingkat pelanggaran dan bertujuan memulihkan keseimbangan","Selalu berupa denda uang dalam jumlah besar","Ditentukan oleh satu orang saja tanpa persetujuan masyarakat"],"a":1,"e":"Sanksi adat yang adil disepakati bersama dan bertujuan memulihkan keseimbangan, bukan sekadar menghukum."},{"q":"Mengapa sanksi dan pengakuan kesalahan disebut sebagai satu kesatuan yang tidak terpisahkan?","o":["Karena keduanya tidak berkaitan sama sekali","Karena penerimaan sanksi sekaligus merupakan pengakuan kesalahan yang memulihkan kepercayaan sosial","Karena pengakuan kesalahan menghapus semua sanksi","Karena sanksi hanya berupa formalitas tanpa makna"],"a":1,"e":"Penerimaan sanksi sekaligus menjadi bentuk pengakuan kesalahan yang memulihkan harmoni sosial."},{"q":"Upacara pembersihan atau tampung tawar dalam sanksi adat bertujuan untuk...","o":["Menambah hukuman bagi pelanggar","Memulihkan keseimbangan spiritual setelah pelanggaran","Mengucilkan pelanggar selamanya","Menghapus seluruh aturan adat"],"a":1,"e":"Upacara ini bertujuan memulihkan keseimbangan spiritual pascapelanggaran."},{"q":"Konsekuensi sosial bagi pelanggar hukum adat, selain sanksi materi, dapat berupa...","o":["Kenaikan status sosial","Berkurangnya kepercayaan masyarakat","Penghargaan dari desa","Pembebasan dari seluruh kewajiban adat"],"a":1,"e":"Pelanggaran adat dapat berdampak pada berkurangnya kepercayaan masyarakat terhadap pelanggar."},{"q":"Sanksi adat pada akhirnya selalu disertai dengan...","o":["Doa dan harapan pemulihan hubungan sosial","Larangan permanen berinteraksi dengan masyarakat","Penghapusan identitas adat pelanggar","Penambahan kekayaan bagi pelanggar"],"a":0,"e":"Sanksi adat disertai doa dan harapan agar pelanggar dapat kembali diterima masyarakat."},{"q":"Sanksi adat adalah konsekuensi bagi pelanggar...","o":["Aturan atau nilai adat","Aturan sekolah","Aturan olahraga","Aturan lalu lintas"],"a":0},{"q":"Sanksi adat ditetapkan oleh...","o":["Pedagang","Musyawarah tetua/lembaga adat","Wisatawan","Satu orang"],"a":1},{"q":"Sanksi adat dikatakan adil jika...","o":["Ditetapkan sepihak","Seberat mungkin","Mempermalukan pelanggar","Sesuai tingkat pelanggaran dan disepakati bersama"],"a":3},{"q":"Tujuan utama sanksi adat adalah...","o":["Mencari keuntungan","Mempermalukan","Menghukum semata","Memulihkan keseimbangan"],"a":3},{"q":"Pengakuan kesalahan dilakukan...","o":["Tanpa saksi","Diam-diam","Lewat pesan pribadi","Di hadapan masyarakat"],"a":3},{"q":"Dengan sanksi dan pengakuan tercipta kembali...","o":["Dendam","Perpecahan","Rasa takut","Rasa saling percaya dan harmoni"],"a":3},{"q":"Denda materi dapat berupa...","o":["Hanya kendaraan","Uang, gong, tempayan, atau hasil bumi","Hanya uang digital","Hanya tanah"],"a":1},{"q":"Berat ringannya denda disesuaikan dengan...","o":["Kekayaan hakim","Banyaknya penonton","Berat ringannya pelanggaran","Cuaca"],"a":2},{"q":"Permintaan maaf secara adat dilakukan di hadapan...","o":["Tidak ada","Keluarga saja","Tetua dan masyarakat","Teman dekat saja"],"a":2},{"q":"Tampung tawar disertai...","o":["Pesta","Perlombaan","Doa","Ejekan"],"a":2},{"q":"Konsekuensi sosial bagi pelanggar contohnya...","o":["Berkurangnya kepercayaan masyarakat","Naiknya jabatan","Hadiah","Pujian"],"a":0},{"q":"Doa dalam sanksi adat berharap pelanggar dapat...","o":["Kembali diterima masyarakat","Dilupakan","Dibenci","Diasingkan selamanya"],"a":0},{"q":"Sanksi adat yang bertujuan mempermalukan dianggap...","o":["Tidak sesuai tujuan sanksi adat yang adil","Ideal","Sangat adil","Wajib"],"a":0},{"q":"Sanksi adat termasuk bagian yang...","o":["Tidak penting","Tak terpisahkan dari hukum adat","Hanya pelengkap","Terpisah dari hukum adat"],"a":1},{"q":"Nilai penting sanksi adat adalah menegaskan bahwa...","o":["Pengakuan kesalahan dan pemulihan hubungan adalah bagian penegakan hukum adat","Pelanggar harus dijauhi","Sanksi hanya berupa denda","Hukuman harus keras"],"a":0}]}];const DAYAK={"key":"dy","kode":"Dayak","title":"Adat Dayak Kalimantan Tengah","html":"\n<div class=\"card\"><h2>Pengertian Adat Istiadat</h2>\n<div class=\"def\">Menurut KBBI, adat istiadat ialah tata kelakuan yang turun-temurun dan kekal dari generasi satu ke generasi lainnya sebagai warisan, sehingga integrasinya kuat terkait dengan pola perilaku masyarakat.</div></div>\n<div class=\"card\"><h2>Upacara Adat di Kalimantan Tengah</h2>\n<div class=\"grid\">\n<div class=\"mini\"><span class=\"tag\">1</span><br><b>Mamapas Lewu</b><p>Ritual umat penganut agama Kaharingan untuk membersihkan alam dan lingkungan hidup (<i>petak danum</i>) beserta isinya dari berbagai marabahaya, sial, wabah penyakit (<i>rutas pali</i>), dan sebagainya.</p></div>\n<div class=\"mini\"><span class=\"tag\">2</span><br><b>Tiwah</b><p>Upacara bagi seseorang yang telah meninggal. Dilakukan pemindahan tulang ke dalam <i>sandung</i> menurut tahap-tahap yang sudah menjadi tradisi masyarakat Dayak di Kalimantan Tengah.</p></div>\n<div class=\"mini\"><span class=\"tag\">3</span><br><b>Tetek Pantan</b><p>Upacara yang dilakukan dengan rasa bakti dan kepercayaan tinggi; membangkitkan rasa Ketuhanan terhadap segala yang sakral sehingga manusia merasakan rahmat-Nya.</p></div>\n<div class=\"mini\"><span class=\"tag\">4</span><br><b>Nyaki Tihi</b><p>Upacara/kegiatan tradisi bagi perempuan yang sedang hamil anak pertama atau <i>Temei</i> (bahasa Dayak Ngaju).</p></div>\n<div class=\"mini\"><span class=\"tag\">5</span><br><b>Nahunan</b><p>Kewajiban yang tertuang dalam kitab suci Panaturan pasal 53. Berasal dari kata “nuhun” yang berarti turun. Ritual pemberian nama bagi bayi berusia satu bulan atau balita yang dibawa turun keluar rumah.</p></div>\n</div></div>\n<div class=\"card\"><h2>Hutan dalam Kearifan Lokal Dayak</h2>\n\n<p>Hutan adalah sumber kehidupan (makanan, obat-obatan, bahan bangunan, air bersih), penjaga kesuburan tanah, siklus air, dan keanekaragaman hayati, sekaligus tempat roh leluhur bersemayam. Menjaganya berarti menghormati leluhur dan menjamin keberlanjutan bagi generasi berikutnya.</p>\n<div class=\"grid\">\n<div class=\"mini\"><b>Tanah Ulen</b><p>Tradisi melindungi kawasan hutan tertentu dan mengurangi aktivitas manusia di dalamnya.</p></div>\n<div class=\"mini\"><b>Tanean Ulen</b><p>Memberi waktu bagi hutan untuk memulihkan diri (regenerasi).</p></div>\n<div class=\"mini\"><b>Pamali</b><p>Kepercayaan adat untuk menjaga keseimbangan alam; melarang penebangan pohon sembarangan.</p></div>\n<div class=\"mini\"><b>Maraatn</b><p>Pembagian hasil hutan secara adil untuk mengurangi ketimpangan.</p></div>\n</div></div>\n","quiz":[{"q":"Apa definisi adat istiadat menurut KBBI?","o":["Perilaku masyarakat sehari-hari","Tata kelakuan turun-temurun","Norma agama dan kepercayaan","Hukum adat masyarakat lokal","Ritual keagamaan"],"a":1},{"q":"Apa tujuan dari ritual Mamapas Lewu?","o":["Meningkatkan hasil panen","Membersihkan alam dari marabahaya","Menghormati leluhur","Memberikan nama pada bayi","Mengadakan perayaan adat"],"a":1},{"q":"Mamapas Lewu dijalankan oleh umat agama apa?","o":["Islam","Kristen","Kaharingan","Hindu","Buddha"],"a":2},{"q":"Apa yang dilakukan dalam ritual Tiwah?","o":["Membersihkan rumah","Pemindahan tulang ke dalam sandung","Memberi nama bayi","Ritual kelahiran anak pertama","Menanam pohon adat"],"a":1},{"q":"Apa tujuan dari upacara Tetek Pantan?","o":["Melakukan penyucian alam","Menunjukkan rasa bakti kepada Tuhan","Mengatur pembagian tanah","Merayakan panen","Menghormati leluhur"],"a":1},{"q":"Upacara Nyaki Tihi dilakukan untuk siapa?","o":["Orang yang sudah meninggal","Bayi berusia satu  $("fin").classList.add("hide");
 const st=await saveScore(key,nilai,benar,items.length);
 $("res").innerHTML=`<div class="card score"><div>${esc($("nama").value.trim())} • ${$("kelas").value}</div><div class="big">${nilai}</div><div>Benar ${benar} dari ${items.length} soal</div><p class="note">${st==="sheet"?"✅ Nilai sudah dikirim ke Google Sheet guru.":st==="bersama"?"✅ Nilai sudah masuk ke Rekap Nilai bersama.":"⚠ Nilai tersimpan di perangkat ini saja (rekap bersama tidak tersedia)."}</p><button class="btn" onclick="go('Rekap')">Lihat Rekap</button> <button class="btn ghost" onclick="render();window.scrollTo({top:0})">Ulangi Latihan</button></div>`;
 $("res").scrollIntoView({behavior:"smooth"});
}
async function saveScore(key,nilai,benar,total){
 const id=myId(),base=rows[id]||{nama:$("nama").value.trim(),kelas:$("kelas").value};
 const rec={...base,["k"+key]:nilai,["b"+key]:benar+"/"+total,waktu:Date.now()};
 rows[id]=rec;updNav();
 try{localStorage.setItem("mulok_rekap",JSON.stringify(rows))}catch(e){}
 if(SCRIPT_URL){try{await fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({kelas:rec.kelas,nama:rec.nama,key,nilai,benar:benar+"/"+total})});return "sheet"}catch(e){}}
 if(db){try{const ref=db.collection("nilai").doc(id);try{await ref.update({["k"+key]:nilai,["b"+key]:benar+"/"+total,waktu:rec.waktu})}catch(e){await ref.set(rec)}return "bersama"}catch(e){}}
 return "lokal";
}
// rekap
let flt="ALL";
function avg(r){const v=COLS.map(c=>r["k"+c.k]).filter(x=>x!=null);return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length*10)/10:"-"}
async function loadSheet(){if(!SCRIPT_URL)return;try{const r=await fetch(SCRIPT_URL),d=await r.json(),o={};d.forEach(x=>o[x.kelas+"__"+String(x.nama).toLowerCase().replace(/[^a-z0-9]+/g,"_")]=x);rows=o;updNav();if(cur==="Rekap")rekap($("view"))}catch(e){}}
function rekap(v){if(SCRIPT_URL&&!rekap.l){rekap.l=1;loadSheet().then(()=>rekap.l=0)}
 const all=Object.values(rows),ks=["11-1","11-2","11-3","11-4","11-5","11-6"];
 v.innerHTML=`<div class="card"><h2>Rekap Nilai Siswa</h2><div class="note">${all.length} siswa • ${db?"rekap bersama":"data perangkat ini"} • batas tuntas 75</div>
 <div class="chips"><button class="nb ${flt==="ALL"?"on":""}" data-k="ALL">Semua</button>${ks.map(k=>`<button class="nb ${flt===k?"on":""}" data-k="${k}">${k}</button>`).join("")}</div>
 <div class="scroll"><table><tr><th>#</th><th>Nama</th><th>Kelas</th>${COLS.map(c=>`<th>${c.t}</th>`).join("")}<th>Rata-rata</th></tr>
 ${all.filter(r=>flt==="ALL"||r.kelas===flt).sort((a,b)=>a.kelas.localeCompare(b.kelas)||a.nama.localeCompare(b.nama)).map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.nama)}</td><td>${r.kelas}</td>${COLS.map(c=>{const n=r["k"+c.k];return `<td>${n==null?"-":`<span class="pill" style="background:${n>=75?"var(--ok)":"var(--bad)"}">${n}</span>`}</td>`}).join("")}<td><b>${avg(r)}</b></td></tr>`).join("")||`<tr><td colspan="${COLS.length+4}" class="note">Belum ada nilai.</td></tr>`}</table></div>
 <p style="margin-top:12px"><button class="btn ghost" id="csv">⬇ Unduh CSV</button></p></div>`;
 v.querySelectorAll(".chips .nb").forEach(b=>b.onclick=()=>{flt=b.dataset.k;rekap(v)});
 $("csv").onclick=async()=>{const h=["Kelas","Nama",...COLS.map(c=>c.t),"Rata-rata"];const csv=[h,...all.sort((a,b)=>a.kelas.localeCompare(b.kelas)||a.nama.localeCompare(b.nama)).map(r=>[r.kelas,r.nama,...COLS.map(c=>r["k"+c.k]??""),avg(r)])].map(x=>x.map(y=>'"'+String(y).replace(/"/g,'""')+'"').join(",")).join("\n");try{const d=await claude.use("downloads");if(d){await d.save({filename:"rekap-nilai-mulok-xi.csv",data:csv});return}}catch(e){}const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="rekap-nilai-mulok-xi.csv";a.click()}
}
try{rows=JSON.parse(localStorage.getItem("mulok_rekap")||"{}")}catch(e){}
updNav();render();loadSheet();
(async()=>{try{db=await claude.use("db");if(db){$("dbst").textContent="Rekap bersama aktif";db.collection("nilai").onSnapshot(s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data());rows=o;updNav();if(cur==="Rekap")rekap($("view"))},()=>{db=null;$("dbst").textContent=""})}}catch(e){db=null}})();
</script>
</body>
</html>
